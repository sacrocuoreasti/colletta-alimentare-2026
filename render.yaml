# Configurazione pronta per uso futuro. Non avvia alcun deploy da sola.
# Usa questa cartella come radice del repository su Render.
services:
  - type: web
    name: colletta-alimentare-2026
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_PATH
        value: /var/data/colletta.sqlite
    disk:
      name: colletta-data
      mountPath: /var/data
      sizeGB: 1
